name: QA Tests

# Runs automatically on every push and on every Pull Request, against main.
# GitHub's own machines (not your computer) check out the code fresh and run
# the whole test suite. If anything fails, the commit/PR gets a clear red X
# instead of finding out later by hand.
#
# THE SUITE RUNS ON TWO PLATFORMS, AND THE ROLES DIFFER:
#
# - windows-latest is the platform the app actually ships on: real Segoe UI
#   metrics, Windows Tk, no virtual display. A red here is a product bug --
#   the fix goes in the app, never in the check.
# - ubuntu-latest keeps exercising the pure logic and everything that turned
#   out to behave differently under X11 (async window mapping, focus
#   semantics, attribute types) -- differences that have caught real bugs.
#
# House rule, learned the long way: a failing check is never routed around.
# The handful of checks that measure Windows-specific pixels are asserted
# where that claim applies (sys.platform gates inside the qa scripts) --
# and the Windows job below is exactly what makes those assertions bite in
# CI rather than only on a developer's machine.
# WHEN IT RUNS, AND WHY NOT MORE OFTEN
#
# This is a private repository, so every minute is billed against the
# account's monthly allowance -- and this suite is the expensive one:
# two platforms, and a Windows minute counts as two. Four measures keep
# it inside the allowance without narrowing what gets checked:
#
#   * Once per change, not twice. Pushes are watched only on `main`;
#     work on a branch is covered by its pull request. A branch with an
#     open PR used to run the whole matrix twice, on the push AND on the
#     PR, for one set of commits. (To see a verdict before opening a PR,
#     use the Run workflow button -- workflow_dispatch, below.)
#   * Only when it could tell us something. A paragraph of documentation,
#     a screenshot, a row in the test plan or the website (site/, which
#     only reads this repository and has checks of its own) cannot turn a
#     check red.
#     Everything NOT listed under paths-ignore still triggers it --
#     `noteorganizer/`, `note_organizer.py`, `test_*.py`, `qa/qa*.py`,
#     `tools/`, the spec file and this workflow included.
#   * A new push cancels the run it has already made pointless.
#   * And the timeout below, which was here first.
#
# NOTE, if required status checks are ever turned on for `main`: a
# documentation-only PR will not run this workflow at all, so a required
# "qa" check would stay pending forever and block the merge. Say so and
# this gets solved a different way. Such a PR runs docs.yml instead: the
# test plan's numbers, the links between the documents, and English.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "qa/*.xlsx"
      - "site/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "qa/*.xlsx"
      - "site/**"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:

# One run per branch. A push that supersedes another makes the older run
# pointless the moment it lands, and a pointless run still costs minutes.
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    strategy:
      # One platform failing must not cancel the other -- seeing BOTH
      # verdicts is the point of running both.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A safety net, not a normal expectation — the whole suite runs in well
    # under 5 minutes on Linux; Windows runners are roughly twice as slow,
    # hence the larger number. If anything ever hangs (a dialog waiting for
    # a click that will never come in a headless run, for example), this
    # stops it from silently occupying a runner for hours instead of
    # failing loudly.
    timeout-minutes: 25
    env:
      # The qa scripts print check names containing emoji and box glyphs;
      # a Windows console defaults to cp1252 and dies on the first one.
      # (The same variable is set when running the suite locally.)
      PYTHONIOENCODING: utf-8
      # A fresh checkout is a throwaway folder: the scripts that wipe their
      # working folder refuse to run without this marker, which only
      # tools/run_tests.py and this workflow set.
      NOTEORG_SCRATCH: "1"
    defaults:
      run:
        # Git Bash exists on the Windows runners too, so ONE set of steps
        # serves both platforms -- a second, PowerShell copy of every step
        # would be one more thing to forget to update.
        shell: bash
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Kept in step with the development machine (and therefore the
          # packaged .exe, which bundles that same Python). A mismatch
          # here once turned a locally-valid f-string (PEP 701, 3.12+)
          # into a CI-only syntax error.
          python-version: "3.13"

      - name: Install Tkinter and a virtual display (Linux only)
        # GitHub's Linux runners have no physical screen — Tkinter still
        # needs SOMETHING to draw to. Xvfb ("X virtual framebuffer") is a
        # fake display that lives entirely in memory, just for this: real
        # widgets get created and interacted with exactly like on a real
        # screen, the only difference is nobody's looking at it. The
        # Windows runner needs none of this: Windows Tk draws through the
        # normal win32 windowing that is always there.
        #
        # And the fonts of the local mirror (tools/linux-ci), not the
        # runner's: the runner image carries a colour emoji font the mirror
        # does not, and Tk 8.6 measures its glyphs hundreds of pixels wide.
        # The calendar's day markers, drawn in "Segoe UI Emoji", which Linux
        # resolves to that font, overflowed every day, and qa7 went red here
        # and nowhere else. The last line says what is left.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
          sudo apt-get remove -y fonts-noto-color-emoji
          fc-list : family | grep -i emoji || echo "no emoji font left"

      - name: Decide how a GUI test runs here
        # Every step below says "$GUI script.py" and stays identical on
        # both platforms; only this line knows the difference.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            echo "GUI=xvfb-run -a python" >> "$GITHUB_ENV"
          else
            echo "GUI=python" >> "$GITHUB_ENV"
          fi

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Static checks — names resolve, class surface unchanged
        # Both catch mistakes that moving code makes easy and that neither
        # importing nor the GUI tests reliably notice: a name left without
        # its import (Python only looks names up when a line actually runs,
        # so the module still imports), and a method lost, duplicated or
        # re-signatured while being moved between files.
        run: |
          python tools/check_undefined_names.py note_organizer.py noteorganizer/core/*.py noteorganizer/ui/*.py qa/*.py test_*.py tools/*.py
          python tools/check_class_api.py
          python tools/check_one_definition.py
          python tools/check_english.py
          python tools/check_agent_rules.py
          python tools/check_comments.py
          python tools/check_contrast.py
          python tools/check_mutant_targets.py
          python tools/check_shipped.py
          python tools/check_guest.py

      - name: Recurrence engine tests
        run: python test_recurrence.py

      - name: Data safety tests — backups and migration
        run: python test_data_safety.py

      - name: Note identity tests — the uid that survives leaving the app
        run: python test_note_identity.py

      - name: Calculator expression evaluator tests
        run: python test_calculator.py

      - name: Table tests -- rows as lines of text, both ways through HTML
        run: python test_tables.py

      - name: Rich text tests -- HTML in, HTML out, the exported document
        run: python test_richtext.py

      - name: Spelling tests -- what is underlined, and what is left alone
        run: python test_spelling.py

      - name: Entry-module identity — Settings labels survive a real launch
        # Builds a window, so it needs a display. This one cannot be folded
        # into the QA scripts: they all do `import note_organizer`, which is
        # exactly the condition that hides the bug it guards.
        run: $GUI test_entry_module_identity.py

      - name: QA1 — Notes, categories, templates
        # The QA scripts run with qa/ as the working directory, so they need
        # note_organizer.py beside them — that's also what puts their test
        # data in qa/ rather than the repo root, since resolve_data_dir()
        # keys off the module's own location. The noteorganizer/ package has
        # to travel with it now that note_organizer.py imports from it;
        # copying rather than relying on PYTHONPATH keeps everything the
        # tests touch inside this one folder. The licenses go too: About
        # opens them from beside the package, and qa6 presses that button.
        # All three persist for the QA2-QA9 steps below, which only clear
        # the data files between runs.
        run: |
          cd qa
          cp ../note_organizer.py ../THIRD_PARTY_NOTICES.txt .
          cp -r ../noteorganizer .
          rm -rf attachments *.json
          $GUI qa1.py

      - name: QA2 — Recurrence, calendar, duplicates
        # Each QA step starts from a clean slate (no leftover settings.json,
        # notes_data.json, trash.json, etc. from the step before it) — every
        # script should behave the same whether it's run alone or as part of
        # this whole sequence, not depend on what ran immediately before it.
        run: |
          cd qa
          rm -rf attachments *.json
          $GUI qa2.py

      - name: QA3 — Trash, share, import/export
        run: |
          cd qa
          rm -rf attachments *.json
          $GUI qa3.py

      - name: QA4 — Theming, stress, memory-leak regression
        run: |
          cd qa
          rm -rf attachments *.json
          $GUI qa4.py

      - name: QA5 — Corrupt data, edge cases
        run: |
          cd qa
          rm -rf attachments *.json
          $GUI qa5.py

      - name: QA6 — Grouping, Settings, Attachments, Combinations, Layout
        run: |
          cd qa
          rm -rf attachments *.json
          $GUI qa6.py

      - name: QA7 — Calendar delete, multi-select, image preview, autosave & memory fixes
        run: |
          cd qa
          rm -rf attachments *.json
          $GUI qa7.py

      - name: QA8 — Search debounce and background-timer robustness
        run: |
          cd qa
          rm -rf attachments *.json
          $GUI qa8.py

      - name: QA9 — Nested-dropdown-inside-popup fix (template editor, jump-to-month)
        run: |
          cd qa
          rm -rf attachments *.json
          $GUI qa9.py

  coverage:
    # How much of the app the suite executes, measured on every run of this
    # workflow, on Linux only (a Linux minute is half the price). A floor,
    # not a target: it is there to notice a suite that quietly stopped
    # running -- the coverage tool itself once ran for weeks with every qa
    # script refusing to start -- and tools/run_coverage.py also fails
    # outright when any suite does not reach its own footer. Chasing the
    # number would invite checks written for the percentage.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Tkinter and a virtual display
        # With the local mirror's fonts, as in the qa job above, and for the
        # same reason: the runner's colour emoji font breaks the calendar's
        # day markers under Tk 8.6.
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
          sudo apt-get remove -y fonts-noto-color-emoji
          fc-list : family | grep -i emoji || echo "no emoji font left"

      - name: Install Python dependencies, and coverage (a measuring tool, not an app dependency)
        run: pip install -r requirements.txt coverage==7.16.0

      - name: Measure, with a floor
        # 80: the suite executes 89.2% of the app's lines on Windows (3 Oct);
        # Linux runs fewer Windows-only branches, hence the margin.
        run: xvfb-run -a python tools/run_coverage.py --fail-under 80
