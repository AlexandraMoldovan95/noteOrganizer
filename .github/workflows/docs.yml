name: Documents

# The checks a change to the documents or the test plan can turn red, and
# nothing else. The QA suite (tests.yml) skips such a change, as it should:
# a paragraph cannot break the app. But the documents can break themselves
# -- a link to a heading reworded since, a count of the test plan copied by
# hand and left behind (the excerpt once gave 859 cases under a heading of
# 921), Romanian in a public page -- and nothing ran on them.
#
# One Linux job of well under a minute, billed by the minute: it starts
# only when a document, the test plan, one of these gates or this file
# changes. openpyxl reads the workbook; it is a tool of this check, not of
# the app, and is not in requirements.txt.
on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "qa/*.xlsx"
      - "tools/check_test_plan.py"
      - "tools/check_doc_links.py"
      - "tools/check_english.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "**.md"
      - "qa/*.xlsx"
      - "tools/check_test_plan.py"
      - "tools/check_doc_links.py"
      - "tools/check_english.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

# The token GitHub gives each run may read the code and nothing more:
# nothing here pushes, comments or publishes.
permissions:
  contents: read

jobs:
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install the workbook reader
        run: pip install openpyxl==3.1.5

      - name: The test plan's numbers, wherever they are written
        run: python tools/check_test_plan.py

      - name: Every link between the documents leads somewhere
        run: python tools/check_doc_links.py

      - name: English throughout
        run: python tools/check_english.py
