name: Mutants

# The mutation catalogue, on demand. Each entry in tools/mutants.json takes a
# fix back out of the app and names the checks that must go red because of
# it; tools/mutate.py applies each one to a fresh copy and reports KILLED,
# SURVIVED, or that the catalogue no longer matches the code (PATTERN).
# Two entries test the runner itself: one mutant that must die and one
# equivalent mutant that must survive.
#
# Manual only (the Actions tab, "Run workflow"): its verdicts change only
# when the catalogue or the code it names does, and every run costs
# minutes. Linux, because a Linux minute is half the price of a Windows one.
# A run takes a piece of the catalogue, named by ids or their first letters:
# the whole of it runs for many hours, past what one job may last.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Mutant ids or prefixes, space-separated (e.g. PN or DR01 X01)"
        required: true

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Tkinter and a virtual display
        # With the local mirror's fonts, as in tests.yml's qa job, and for
        # the same reason: the runner's colour emoji font breaks the
        # calendar's day markers under Tk 8.6.
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
          sudo apt-get remove -y fonts-noto-color-emoji
          fc-list : family | grep -i emoji || echo "no emoji font left"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: The runner's own two checks
        run: xvfb-run -a python tools/mutate.py --self-test

      - name: The piece of the catalogue asked for
        # Through the environment, not pasted into the command: the words
        # typed into the form are read as data, never as shell.
        env:
          IDS: ${{ inputs.ids }}
        run: xvfb-run -a python tools/mutate.py $IDS
