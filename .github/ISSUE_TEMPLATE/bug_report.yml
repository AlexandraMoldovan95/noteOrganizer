name: Bug report
description: Something in Note Organizer did not do what it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for writing this down. Exact steps are what find the cause fastest:
        what you did, what you expected, and what happened instead.
  - type: dropdown
    id: severity
    attributes:
      label: How bad is it?
      options:
        - Something I wrote was lost or changed
        - The app stopped, froze or would not start
        - A feature does the wrong thing
        - Something looks wrong or reads badly
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What you did, one step per line, starting from opening the app.
      placeholder: |
        1. Open a note with a table in it
        2. Click in the second row and press Ctrl+Z
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings, then About, shows it.
      placeholder: "0.88.361"
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Theme and Windows version
      placeholder: Warm Cream, Windows 11
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or crash log
      description: >-
        Drag a screenshot here. If the app wrote a crash_log.txt beside your notes, paste its
        last part -- read it first, as it can show file paths from your computer.
